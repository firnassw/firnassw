name: Update Latest Projects

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update projects
        uses: actions/github-script@v7
        with:
          script: |
            const username = context.repo.owner;

            const repos = await github.paginate(
              github.rest.repos.listForUser,
              {
                username: username,
                per_page: 100,
                sort: "updated",
                direction: "desc"
              }
            );

            const projects = repos
              .filter(repo =>
                !repo.fork &&
                !repo.archived &&
                repo.name !== username
              )
              .slice(0, 6);

            let content = "";

            if (projects.length === 0) {
              content = "- Belum ada project.";
            } else {
              content = projects.map(repo => {
                const description =
                  repo.description || "No description available.";

                return `- 🚀 [${repo.name}](${repo.html_url}) — ${description}`;
              }).join("\n");
            }

            const fs = require("fs");
            const file = "README.md";

            let readme = fs.readFileSync(file, "utf8");

            const start = "<!-- PROJECTS:START -->";
            const end = "<!-- PROJECTS:END -->";

            const regex = new RegExp(
              `${start}[\\s\\S]*?${end}`
            );

            const replacement =
              `${start}\n${content}\n${end}`;

            if (regex.test(readme)) {
              readme = readme.replace(regex, replacement);
            } else {
              readme += `\n\n## 🚀 Latest Projects\n\n${replacement}\n`;
            }

            fs.writeFileSync(file, readme);

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update latest projects"
            git push
          fi
