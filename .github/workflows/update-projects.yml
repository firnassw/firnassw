name: Update Latest Projects

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-projects:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Latest Projects
        uses: actions/github-script@v7
        with:
          script: |
            const username = context.repo.owner;

            const repos = await github.paginate(
              github.rest.repos.listForUser,
              {
                username: username,
                sort: "updated",
                direction: "desc",
                per_page: 100
              }
            );

            const projects = repos
              .filter(repo => !repo.fork && !repo.archived)
              .slice(0, 6)
              .map(repo => {
                const description =
                  repo.description || "No description available";

                return `- [${repo.name}](${repo.html_url}) — ${description}`;
              })
              .join("\n");

            const fs = require("fs");
            const path = "README.md";

            let readme = fs.readFileSync(path, "utf8");

            const start = "<!-- PROJECTS:START -->";
            const end = "<!-- PROJECTS:END -->";

            const newSection =
              `${start}\n${projects}\n${end}`;

            const regex = new RegExp(
              `${start}[\\s\\S]*?${end}`,
              "m"
            );

            if (regex.test(readme)) {
              readme = readme.replace(regex, newSection);
            } else {
              readme += `\n\n## 🚀 Latest Projects\n\n${newSection}\n`;
            }

            fs.writeFileSync(path, readme);

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update latest projects"
            git push
          fi
