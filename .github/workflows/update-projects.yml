name: Update Latest Projects

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Latest Projects
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const username = "firnassw";

            const repos = await github.paginate(
              github.rest.repos.listForUser,
              {
                username: username,
                per_page: 100,
                sort: "updated",
                direction: "desc"
              }
            );

            const projects = repos
              .filter(repo =>
                !repo.fork &&
                !repo.archived &&
                repo.name !== username
              )
              .slice(0, 6);

            const projectList = projects.map(repo => {
              const description =
                repo.description || "Personal project";

              return `- 🚀 [${repo.name}](${repo.html_url}) — ${description}`;
            }).join("\n");

            const start = "<!-- PROJECTS:START -->";
            const end = "<!-- PROJECTS:END -->";

            const fs = require("fs");
            const readmePath = "README.md";

            let readme = fs.readFileSync(readmePath, "utf8");

            const replacement =
              `${start}\n${projectList}\n${end}`;

            const regex = new RegExp(
              `${start}[\\s\\S]*?${end}`,
              "m"
            );

            if (regex.test(readme)) {
              readme = readme.replace(regex, replacement);
            } else {
              readme += `\n\n${replacement}\n`;
            }

            fs.writeFileSync(readmePath, readme);

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes detected"
          else
            git commit -m "docs: update latest projects"
            git push
          fi
